<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>나만의 톡</title>
<style>
:root { --yellow:#fee500; --ink:#191919; --sub:#929292; --line:#f0f0f0; --chat:#b7c6d0; --safe-bottom:env(safe-area-inset-bottom,0px); }
* {box-sizing:border-box} html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:#f2f2f2;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit} button{border:0;cursor:pointer;background:none;color:inherit} input:focus,textarea:focus{outline:none} #app{height:100dvh;max-width:480px;margin:auto;background:white;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 0 36px #0000000b}
.statusbar{height:35px;min-height:35px;display:flex;align-items:center;justify-content:space-between;padding:6px 25px 0;font-size:15px;font-weight:650;letter-spacing:-.3px;z-index:3;background:white}.status-icons{display:flex;align-items:center;gap:5px}.status-icons svg{width:17px;height:17px}.battery{height:12px;width:23px;border:1.8px solid currentColor;border-radius:4px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-4px;top:3px;height:4px;width:2px;background:currentColor;border-radius:2px}.battery i{display:block;background:currentColor;width:77%;height:100%;border-radius:1px}
.topbar{height:58px;min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 20px;background:white}.topbar h1{font-size:23px;font-weight:750;letter-spacing:-1px;margin:0}.actions{display:flex;align-items:center;gap:3px}.iconbtn{width:36px;height:38px;display:grid;place-items:center;border-radius:12px}.iconbtn:active{background:#f2f2f2}.ico{width:23px;height:23px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.scroll{overflow-y:auto;overscroll-behavior:contain;flex:1}.tabs{height:67px;min-height:67px;padding:9px 9px calc(8px + var(--safe-bottom));box-sizing:content-box;background:#f9f9f9;border-top:1px solid #eee;display:flex;align-items:flex-start;justify-content:space-around}.tab{width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#aaa;font-size:10px;position:relative}.tab .ico{width:27px;height:27px}.tab.active{color:#1c1c1c}.tab .dot{width:6px;height:6px;border-radius:50%;background:#f76456;position:absolute;top:0;right:16px}
#listView{display:flex;flex-direction:column;flex:1;min-height:0} #chatView{display:none;flex-direction:column;flex:1;min-height:0;background:var(--chat)}
.searcharea{padding:0 18px 9px;display:none}.searcharea.open{display:block}.searchbox{width:100%;border:none;border-radius:9px;background:#f5f5f5;padding:11px 13px;font-size:14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;padding:14px 19px 6px;font-size:11px;color:#8a8a8a}.sectionhead button{padding:3px 6px;color:#9b9b9b}.divider{height:1px;background:#efefef;margin:10px 20px 2px}.person{width:100%;display:flex;align-items:center;text-align:left;padding:9px 19px;gap:12px;min-height:64px}.person:active{background:#f7f7f7}.person.me{padding-top:12px;padding-bottom:14px;min-height:85px}.avatar{width:48px;height:48px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:25px;flex:0 0 auto;background:#d7d7d7;overflow:hidden;color:#fff;position:relative}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.me{width:59px;height:59px;border-radius:22px}.avatar.small{width:42px;height:42px;border-radius:15px}.avatar.tiny{width:22px;height:22px;border-radius:8px;font-size:13px}.person-details{flex:1;min-width:0}.name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{font-size:12px;color:#a0a0a0;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.music-pill{flex-shrink:0;max-width:100px;border:1px solid #8bcf75;border-radius:16px;font-size:10px;color:#555;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.updated{display:flex;gap:14px;overflow:auto;padding:7px 18px 10px;scrollbar-width:none}.updated::-webkit-scrollbar{display:none}.updated-item{width:59px;min-width:59px;text-align:center;font-size:11px}.updated-item .avatar{width:53px;height:53px;margin:0 auto 5px;border-radius:19px}.birth{margin:9px 18px 7px;padding:11px 14px;display:flex;align-items:center;gap:12px;border-radius:12px;background:#fff4f2;font-size:12px;color:#555}.birthday{background:#ff7b7b;border-radius:14px;color:white;padding:8px;font-size:19px}.empty{padding:40px 22px;text-align:center;color:#999;font-size:13px;line-height:1.8}.hint{font-size:12px;text-align:center;color:#aaa;margin:17px}
.chatlist-row{display:flex;align-items:center;width:100%;gap:12px;padding:12px 18px;text-align:left}.chatlist-row:active{background:#f6f6f6}.chatlist-row .avatar{width:54px;height:54px;border-radius:19px}.chatlist-meta{margin-left:auto;align-self:flex-start;color:#999;font-size:10px;padding-top:5px;white-space:nowrap}.message-preview{font-size:13px;color:#999;margin-top:7px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-top{background:var(--chat);height:53px;min-height:53px;display:flex;align-items:center;padding:0 14px;gap:10px}.chat-top .iconbtn{width:33px}.chat-title{font-size:17px;font-weight:650;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-log{padding:12px 13px 23px;flex:1;overflow:auto;overscroll-behavior:contain}.date-line{display:table;margin:7px auto 19px;background:#93a5b4;color:#f7fbfd;padding:6px 14px;font-size:10px;border-radius:20px}.msg-row{display:flex;gap:6px;align-items:flex-start;margin:0 0 11px}.msg-row.mine{justify-content:flex-end}.msg-row .avatar{width:36px;height:36px;border-radius:13px;font-size:19px}.msg-content{max-width:77%;min-width:0}.msg-name{font-size:12px;margin:0 0 5px 4px}.bubble-line{display:flex;gap:5px;align-items:flex-end}.mine .bubble-line{flex-direction:row-reverse}.bubble{background:white;border-radius:4px 13px 13px 13px;padding:9px 11px;font-size:14px;line-height:1.47;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px #00000009}.mine .bubble{background:var(--yellow);border-radius:13px 4px 13px 13px}.msg-time{font-size:10px;color:#586773;white-space:nowrap}.composer{background:white;border-top:1px solid #d0d0d0;padding:9px 12px calc(10px + var(--safe-bottom));display:flex;align-items:flex-end;gap:7px}.composer textarea{flex:1;min-height:36px;max-height:105px;resize:none;line-height:1.5;padding:8px 10px;border-radius:9px;border:1px solid #eee;font-size:14px;outline:none}.sendbtn{background:#fee500;border-radius:8px;padding:9px 11px;min-width:45px;font-size:13px;font-weight:650}.sender-toggle{font-size:10px;color:#5e6771;background:#e9edf0;white-space:nowrap;padding:7px 6px;border-radius:6px;margin-bottom:4px}.chat-tiny-note{background:#a8b8c5;color:#fff;font-size:11px;text-align:center;padding:8px}
.overlay{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;background:#fff}.overlay.show{display:flex}.overlay.statusdark .statusbar,.overlay.statusdark .topbar{background:#27323c;color:white}.profile{background:linear-gradient(140deg,#788ba3,#454d62 65%,#303b46);color:white}.profile .statusbar{background:transparent}.profile .profileheader{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.profile-body{flex:1;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;padding-bottom:24px}.profile-body .avatar{width:94px;height:94px;border-radius:35px;font-size:46px;border:1px solid #ffffff33}.profile-body h2{font-size:20px;margin:12px 0 7px}.profile-body p{font-size:13px;opacity:.85;margin:0 0 24px}.profile-actions{width:100%;border-top:1px solid #ffffff50;display:flex;justify-content:center;padding:17px 0 5px;gap:40px}.profile-action{color:white;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:9px}.profile-action .ico{width:27px;height:27px}
.modal-bg{position:absolute;inset:0;background:#0007;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal-bg.show{display:flex}.modal{background:#fff;border-radius:18px;padding:20px;width:min(100%,365px);max-height:88%;overflow:auto;box-shadow:0 10px 45px #0002}.modal h2{font-size:18px;margin:0 0 18px}.field{display:block;font-size:12px;color:#777;margin:14px 0 5px}.fieldinput{display:block;width:100%;border:1px solid #e5e5e5;border-radius:9px;padding:11px 12px;font-size:14px}.form-actions{display:flex;justify-content:flex-end;margin-top:24px;gap:8px}.secondary{background:#f1f1f1;padding:11px 15px;border-radius:9px;font-size:13px}.primary{background:var(--yellow);padding:11px 17px;border-radius:9px;font-weight:650;font-size:13px}.danger{color:#c83d39;margin-right:auto;font-size:13px;padding:8px}.photohelp{font-size:11px;color:#999;line-height:1.5;margin-top:5px}.toast{position:absolute;z-index:99;bottom:100px;left:50%;transform:translateX(-50%);background:#222e;color:white;padding:9px 18px;font-size:12px;border-radius:19px;white-space:nowrap;display:none}.toast.show{display:block}
@media (min-width:600px){#app{height:min(96dvh,900px);margin:2dvh auto;border-radius:24px;box-shadow:0 12px 55px #0002}}
</style>
</head>
<body>
<div id="app">
 <div id="listView">
  <div class="statusbar"><span class="clock">9:41</span><span class="status-icons"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 14h3v4H2zm4-3h3v7H6zm4-3h3v10h-3zm4-4h3v14h-3z"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 8a16 16 0 0120 0M5 12a11 11 0 0114 0M9 16a5 5 0 016 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg><div class="battery"><i></i></div></span></div>
  <header class="topbar"><h1 id="pageTitle">친구</h1><div class="actions"><button class="iconbtn" id="searchBtn" title="검색"><svg class="ico"><use href="#i-search"/></svg></button><button class="iconbtn" id="addBtn" title="친구 추가"><svg class="ico"><use href="#i-userplus"/></svg></button><button class="iconbtn" id="musicBtn" title="음악"><svg class="ico"><use href="#i-music"/></svg></button><button class="iconbtn" id="settingsBtn" title="설정"><svg class="ico"><use href="#i-settings"/></svg></button></div></header>
  <div class="searcharea" id="searchArea"><input id="searchInput" class="searchbox" placeholder="이름, 메시지 검색" autocomplete="off" /></div>
  <main class="scroll" id="content"></main>
  <nav class="tabs"><button class="tab active" data-tab="friends"><svg class="ico"><use href="#i-user"/></svg><span>친구</span></button><button class="tab" data-tab="chats"><svg class="ico"><use href="#i-chat"/></svg><span>채팅</span></button><button class="tab" data-tab="more"><svg class="ico"><use href="#i-dots"/></svg><span>더보기</span></button></nav>
 </div>
 <section id="chatView"><div class="statusbar" style="background:var(--chat)"><span class="clock">9:41</span><span class="status-icons"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 14h3v4H2zm4-3h3v7H6zm4-3h3v10h-3zm4-4h3v14h-3z"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 8a16 16 0 0120 0M5 12a11 11 0 0114 0M9 16a5 5 0 016 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg><div class="battery"><i></i></div></span></div>
  <div class="chat-top"><button class="iconbtn" id="chatBack" title="뒤로"><svg class="ico"><use href="#i-back"/></svg></button><button class="chat-title" id="chatTitle">친구</button><button class="iconbtn" id="chatMenu" title="채팅방 메뉴"><svg class="ico"><use href="#i-menu"/></svg></button></div>
  <div class="chat-log" id="chatLog"></div><div class="composer"><button class="sender-toggle" id="senderToggle">나로 보내기</button><textarea id="msgInput" rows="1" placeholder="메시지 입력"></textarea><button class="sendbtn" id="sendBtn">전송</button></div>
 </section>
 <section class="overlay profile" id="profileOverlay"><div class="statusbar"><span class="clock">9:41</span><span class="status-icons">●●●  ▰</span></div><div class="profileheader"><button class="iconbtn" id="profileClose" title="닫기"><svg class="ico"><use href="#i-close"/></svg></button><button class="iconbtn" id="profileOptions" title="편집"><svg class="ico"><use href="#i-dots"/></svg></button></div><div class="profile-body" id="profileBody"></div></section>
 <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
 <svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
  <symbol id="i-userplus" viewBox="0 0 24 24"><circle cx="9" cy="7.5" r="3.3"/><path d="M2.5 19c0-3.4 2.6-5.7 6.5-5.7s6.5 2.3 6.5 5.7M18.5 8v8m-4-4h8"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7.8" r="4.1"/><path d="M4 21v-1.3a8 8 0 0 1 16 0V21"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M8 18V5l12-2v12"/><ellipse cx="5.5" cy="18.5" rx="3.5" ry="2.4"/><ellipse cx="16.5" cy="15.5" rx="3.5" ry="2.4"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M9.5 2.8h5l.8 2.5 2.1 1.2 2.6-.5 2.5 4.3-1.9 1.9v2.4l1.9 1.9-2.5 4.3-2.6-.5-2.1 1.2-.8 2.5h-5l-.8-2.5-2.1-1.2-2.6.5-2.5-4.3 1.9-1.9v-2.4l-1.9-1.9L4 6l2.6.5 2.1-1.2z" transform="translate(0,-.9) scale(.98)"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.8c0 5-3.8 8.1-9 8.1-1.1 0-2.2-.1-3.2-.5L3 21l1.6-4.6A7.6 7.6 0 0 1 3 11.8C3 7.3 6.8 4 12 4s9 3.3 9 7.8z"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 3-9 9 9 9"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M4 4 20 20M20 4 4 20"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="m4 17-1 4 4-1L20 7l-3-3zM14 7l3 3"/></symbol>
 </defs></svg>
</div>
<script>
(()=>{
'use strict';
const KEY='mytalk_mobile_v1';
const defaults={me:{id:'me',name:'나',status:'오늘도 좋은 하루 ♡',emoji:'🐰',color:'#c5c9f4',photo:'',music:'♡'},friends:[{id:'f1',name:'연재',status:'안녕! 오늘도 놀러 왔어?',emoji:'🐱',color:'#f1b9bb',music:'',photo:'',favorite:true},{id:'f2',name:'세아',status:'좋은 것만 보자 ♡',emoji:'🐻',color:'#c3b4a2',music:'',photo:'',favorite:false},{id:'f3',name:'우주',status:'반짝이는 하루 ✨',emoji:'🌙',color:'#a1b8d9',music:'',photo:'',favorite:false}],chats:{f1:[{by:'other',text:'오늘도 놀러 왔네 ♡',at:'오후 1:12'},{by:'me',text:'웅! ♡',at:'오후 1:13'}],f2:[{by:'other',text:'안녕! 오늘 하루 어땠어?',at:'오전 10:24'}],f3:[{by:'other',text:'🌙',at:'어제'}]},wallpaper:'#b7c6d0'};
let state=load(), tab='friends', chatId=null, profileId=null, by='me', searchVisible=false;
const el=id=>document.getElementById(id);const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.me&&Array.isArray(d.friends)&&d.chats)return d;}catch(e){}return structuredClone(defaults)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('저장 공간이 부족해요. 사진 용량을 줄여 주세요.')}}
function toast(t){el('toast').textContent=t;el('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el('toast').classList.remove('show'),2500)}
function person(id){return id==='me'?state.me:state.friends.find(f=>f.id===id)}
function avatar(p,cls=''){if(!p)return '';return `<span class="avatar ${cls}" style="background:${safe(p.color||'#ccd3db')}">${p.photo?`<img src="${safe(p.photo)}" alt="">`:safe(p.emoji||'♡')}</span>`}
function icon(n){return `<svg class="ico"><use href="#i-${n}"/></svg>`}
function time(){const d=new Date();return `${d.getHours()<12?'오전':'오후'} ${d.getHours()%12||12}:${('0'+d.getMinutes()).slice(-2)}`}
function setClocks(){const d=new Date();document.querySelectorAll('.clock').forEach(e=>e.textContent=`${d.getHours()}:${('0'+d.getMinutes()).slice(-2)}`)}
function setTab(t){tab=t;chatId=null;el('chatView').style.display='none';el('listView').style.display='flex';el('pageTitle').textContent=t==='friends'?'친구':t==='chats'?'채팅':'더보기';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));el('addBtn').style.display=t==='friends'?'grid':'none';el('musicBtn').style.display=t==='friends'?'grid':'none';el('content').scrollTop=0;render()}
function render(){const q=el('searchInput').value.trim().toLowerCase();if(tab==='friends')renderFriends(q);else if(tab==='chats')renderChats(q);else renderMore()}
function renderFriends(q){let html='';if(!q){html+=`<button class="person me" data-profile="me">${avatar(state.me,'me')}<span class="person-details"><div class="name">${safe(state.me.name)}</div><div class="status">${safe(state.me.status)}</div></span>${state.me.music?`<span class="music-pill">♫ ${safe(state.me.music)}</span>`:''}</button>`;html+='<div class="divider"></div><div class="sectionhead">업데이트한 친구 <span>›</span></div><div class="updated">';state.friends.slice(0,5).forEach(p=>html+=`<button class="updated-item" data-profile="${safe(p.id)}">${avatar(p)}<span>${safe(p.name)}</span></button>`);html+='</div><div class="divider"></div><div class="birth"><span class="birthday">🎂</span><span style="flex:1">친구의 생일을 확인해 보세요!</span><span>›</span></div>'}
const friends=state.friends.filter(p=>p.name.toLowerCase().includes(q)||p.status.toLowerCase().includes(q));const favorites=friends.filter(p=>p.favorite);if(favorites.length&&!q){html+='<div class="divider"></div><div class="sectionhead">즐겨찾기 <span>⌃</span></div>';favorites.forEach(p=>html+=rowFriend(p))}
html+=`<div class="divider"></div><div class="sectionhead">친구 ${friends.length}<span>⌃</span></div>`;friends.forEach(p=>html+=rowFriend(p));if(!friends.length)html+='<div class="empty">아직 친구가 없어!<br>오른쪽 위 사람+ 버튼으로 친구를 추가해 봐 ♡</div>';html+='<p class="hint">이 화면은 내 웹사이트 안에서만 작동해요.</p>';el('content').innerHTML=html}
function rowFriend(p){return `<button class="person" data-profile="${safe(p.id)}">${avatar(p)}<span class="person-details"><div class="name">${safe(p.name)}</div>${p.status?`<div class="status">${safe(p.status)}</div>`:''}</span>${p.music?`<span class="music-pill">♫ ${safe(p.music)}</span>`:''}</button>`}
function renderChats(q){let pairs=Object.keys(state.chats).filter(id=>person(id)&&state.chats[id]?.length).map(id=>({id,p:person(id),msgs:state.chats[id]}));pairs.sort((a,b)=> (b.msgs.at(-1).sort||0)-(a.msgs.at(-1).sort||0));pairs=pairs.filter(c=>c.p.name.toLowerCase().includes(q)||c.msgs.some(m=>m.text.toLowerCase().includes(q)));el('content').innerHTML=pairs.length?pairs.map(c=>`<button class="chatlist-row" data-chat="${safe(c.id)}">${avatar(c.p)}<span class="person-details"><div class="name">${safe(c.p.name)}</div><div class="message-preview">${safe(c.msgs.at(-1).text)}</div></span><span class="chatlist-meta">${safe(c.msgs.at(-1).at||'')}</span></button>`).join(''):'<div class="empty">아직 대화가 없어!<br>친구 프로필에서 채팅을 시작해 봐 ♡</div>'}
function renderMore(){el('content').innerHTML=`<div class="person me" style="padding-top:22px">${avatar(state.me,'me')}<span class="person-details"><div class="name">${safe(state.me.name)}</div><div class="status">${safe(state.me.status)}</div></span></div><div class="divider"></div><button class="person" data-profile="me">${icon('pencil')} <span class="person-details">내 프로필 편집</span><span>›</span></button><button class="person" data-action="add">${icon('userplus')} <span class="person-details">친구 추가</span><span>›</span></button><button class="person" data-action="settings">${icon('settings')} <span class="person-details">화면 설정</span><span>›</span></button><div class="empty">나만의 톡 · 개인용 웹페이지<br>이 브라우저에만 데이터가 저장됩니다.</div>`}
function openProfile(id){const p=person(id);if(!p)return;profileId=id;el('profileOverlay').classList.add('show');el('profileBody').innerHTML=`${avatar(p)}<h2>${safe(p.name)}</h2><p>${safe(p.status||'')}</p><div class="profile-actions">${id!=='me'?`<button class="profile-action" id="goChat">${icon('chat')}<span>1:1 채팅</span></button>`:''}<button class="profile-action" id="goEdit">${icon('pencil')}<span>프로필 편집</span></button></div>`;el('goEdit').onclick=()=>showEdit(id);if(id!=='me')el('goChat').onclick=()=>{closeProfile();openChat(id)}}
function closeProfile(){el('profileOverlay').classList.remove('show');profileId=null}
function openChat(id){const p=person(id);if(!p)return;chatId=id;by='me';state.chats[id]??=[];el('chatTitle').textContent=p.name;el('senderToggle').textContent='나로 보내기';el('listView').style.display='none';el('chatView').style.display='flex';el('msgInput').value='';document.documentElement.style.setProperty('--chat',state.wallpaper||'#b7c6d0');renderLog()}
function renderLog(){const p=person(chatId);if(!p)return;const msgs=state.chats[chatId]||[];const today=new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(new Date());el('chatLog').innerHTML=`<div class="date-line">${safe(today)}</div>`+msgs.map(m=>`<div class="msg-row ${m.by==='me'?'mine':''}">${m.by==='other'?avatar(p):''}<div class="msg-content">${m.by==='other'?`<div class="msg-name">${safe(p.name)}</div>`:''}<div class="bubble-line"><div class="bubble">${safe(m.text)}</div><span class="msg-time">${safe(m.at||'')}</span></div></div></div>`).join('');el('chatLog').scrollTop=el('chatLog').scrollHeight}
function send(){const v=el('msgInput').value.trim();if(!v||!chatId)return;state.chats[chatId]??=[];state.chats[chatId].push({by,text:v,at:time(),sort:Date.now()});save();el('msgInput').value='';renderLog()}
function modal(html){el('modal').innerHTML=html;el('modalBg').classList.add('show')}function closeModal(){el('modalBg').classList.remove('show');el('modal').innerHTML=''}
function showEdit(id){const creating=id==='new';const p=creating?{id:'new',name:'',status:'',emoji:'🐰',color:'#f0c2d0',photo:'',music:''}:person(id);if(!p)return;modal(`<h2>${creating?'친구 추가':'프로필 편집'}</h2><form id="editForm"><label class="field">이름</label><input class="fieldinput" id="edName" required maxlength="26" value="${safe(p.name)}" placeholder="친구 이름"><label class="field">상태 메시지</label><input class="fieldinput" id="edStatus" maxlength="90" value="${safe(p.status||'')}" placeholder="상태 메시지"><label class="field">프로필 이모지</label><input class="fieldinput" id="edEmoji" maxlength="5" value="${safe(p.emoji||'♡')}" placeholder="🐰"><label class="field">프로필 사진 업로드 (선택)</label><input type="file" id="edFile" accept="image/*" class="fieldinput"><p class="photohelp">사진을 선택하면 이모지 대신 표시돼요. 사진은 브라우저에만 저장됩니다.</p><label class="field">프로필 뮤직 / 한마디</label><input class="fieldinput" id="edMusic" maxlength="36" value="${safe(p.music||'')}" placeholder="♫ 노래 제목"><label class="field">프로필 배경색</label><input class="fieldinput" id="edColor" type="color" style="padding:5px;height:43px" value="${safe(p.color||'#d4c0d8')}">${!creating&&id!=='me'?`<label style="display:flex;align-items:center;gap:8px;margin-top:13px;font-size:13px"><input id="edFav" type="checkbox" ${p.favorite?'checked':''}> 즐겨찾기</label>`:''}<div class="form-actions">${!creating&&id!=='me'?'<button type="button" class="danger" id="edDelete">친구 삭제</button>':''}<button type="button" class="secondary" id="edCancel">취소</button><button type="submit" class="primary">저장</button></div></form>`);el('edCancel').onclick=closeModal;if(!creating&&id!=='me')el('edDelete').onclick=()=>{if(!confirm(`${p.name}님을 친구 목록에서 삭제할까요?`))return;state.friends=state.friends.filter(f=>f.id!==id);delete state.chats[id];save();closeModal();closeProfile();setTab('friends');toast('친구를 삭제했어요')};el('editForm').onsubmit=async e=>{e.preventDefault();const name=el('edName').value.trim();if(!name)return;const file=el('edFile').files[0];let photo=p.photo||'';if(file){try{photo=await compressImage(file)}catch(e){toast('이미지를 읽지 못했어요');return}}const next={...p,name,status:el('edStatus').value.trim(),emoji:el('edEmoji').value.trim()||'♡',music:el('edMusic').value.trim(),color:el('edColor').value,photo};if(id==='me'){state.me=next}else if(creating){next.id='f'+Date.now();next.favorite=false;state.friends.push(next)}else{next.favorite=el('edFav').checked;state.friends=state.friends.map(f=>f.id===id?next:f)}save();closeModal();closeProfile();setTab('friends');toast(creating?'친구를 추가했어요 ♡':'프로필을 저장했어요 ♡')}}
function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,350/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'))};img.src=url})}
function addFriend(){showEdit('new')}
function showSettings(){const colors=['#b7c6d0','#b0c3e0','#ddd1d9','#b2ccbc','#b6b6b6'];modal(`<h2>나만의 톡 설정</h2><p style="font-size:13px;color:#777;line-height:1.6">채팅방 배경색을 바꿔 봐! 데이터는 현재 기기의 브라우저에만 저장돼.</p><div style="display:flex;gap:10px;margin:17px 0">${colors.map(c=>`<button class="wallpick" data-color="${c}" style="width:36px;height:36px;border-radius:50%;background:${c};border:2px solid ${state.wallpaper===c?'#111':'#fff'}"></button>`).join('')}</div><p style="font-size:12px;color:#999;line-height:1.6">사이트 주소만 공유해도 내 대화 내용이 함께 공개되는 것은 아니야. 다만 공용 기기에서는 기록이 남을 수 있어.</p><div class="form-actions"><button class="danger" id="resetAll">처음 상태로 초기화</button><button class="primary" id="settingsDone">닫기</button></div>`);el('modal').querySelectorAll('.wallpick').forEach(b=>b.onclick=()=>{state.wallpaper=b.dataset.color;save();document.documentElement.style.setProperty('--chat',state.wallpaper);showSettings()});el('settingsDone').onclick=closeModal;el('resetAll').onclick=()=>{if(!confirm('친구와 대화 기록을 모두 초기화할까요?'))return;state=structuredClone(defaults);save();closeModal();closeProfile();setTab('friends');toast('처음 상태로 돌아왔어요')}}
el('content').addEventListener('click',e=>{const a=e.target.closest('[data-profile],[data-chat],[data-action]');if(!a)return;if(a.dataset.profile)openProfile(a.dataset.profile);else if(a.dataset.chat)openChat(a.dataset.chat);else if(a.dataset.action==='add')addFriend();else if(a.dataset.action==='settings')showSettings()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));el('searchBtn').onclick=()=>{searchVisible=!searchVisible;el('searchArea').classList.toggle('open',searchVisible);if(searchVisible)el('searchInput').focus();else{el('searchInput').value='';render()}};el('searchInput').oninput=render;el('addBtn').onclick=addFriend;el('settingsBtn').onclick=showSettings;el('musicBtn').onclick=()=>toast('프로필에서 원하는 음악 제목을 적어 봐 ♫');el('profileClose').onclick=closeProfile;el('profileOptions').onclick=()=>showEdit(profileId);el('modalBg').onclick=e=>{if(e.target===el('modalBg'))closeModal()};el('chatBack').onclick=()=>setTab('chats');el('chatTitle').onclick=()=>{const id=chatId;setTab('friends');openProfile(id)};el('chatMenu').onclick=()=>toast('아래의 전송자 버튼을 눌러 상대 말풍선도 만들 수 있어!');el('senderToggle').onclick=()=>{by=by==='me'?'other':'me';el('senderToggle').textContent=by==='me'?'나로 보내기':'상대로 보내기'};el('sendBtn').onclick=send;el('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(el('modalBg').classList.contains('show'))closeModal();else if(el('profileOverlay').classList.contains('show'))closeProfile();else if(chatId)setTab('chats')}});setClocks();setInterval(setClocks,30000);setTab('friends');
})();
</script>
</body>
</html>

let characters=[{id:'main',data:structuredClone(defaults)}],activeCharacterId='main',pickerVisible=true,pickerReady=false;
function captureCharacter(){const c=characters.find(x=>x.id===activeCharacterId);if(c)c.data=structuredClone(state)}
function exportCharacters(){captureCharacter();const original=characters.find(x=>x.id==='main')?.data||defaults;const {characters:ignored,...main}=structuredClone(original);return {...main,characters:characters.filter(x=>x.id!=='main').map(c=>({id:c.id,data:structuredClone(c.data)}))}}
function importCharacters(v){if(!v?.me||!Array.isArray(v.friends)||!v.chats)return;const {characters:extra,...main}=v;const loaded=[{id:'main',data:structuredClone(main)}];if(Array.isArray(extra)){for(const c of extra){if(!c||!/^p[a-zA-Z0-9_-]{5,45}$/.test(c.id||'')||!c.data?.me||!Array.isArray(c.data.friends)||!c.data.chats||loaded.some(x=>x.id===c.id))continue;loaded.push({id:c.id,data:structuredClone(c.data)})}}characters=loaded;if(!characters.some(c=>c.id===activeCharacterId))activeCharacterId='main';state=structuredClone(characters.find(c=>c.id===activeCharacterId).data);document.documentElement.style.setProperty('--chat',state.wallpaper||'#b7c6d0');setClocks();closeModal();closeProfile();if(chatId&&!person(chatId))setTab('friends');else if(chatId)renderLog();else render();renderPicker()}
function labelCharacter(c){return c.data?.me?.name||'이름 없는 주인공'}
function renderPicker(){const list=el('pickerList');if(!list)return;list.innerHTML=characters.map(c=>{const p=c.data?.me||defaults.me;const n=Object.keys(c.data?.chats||{}).filter(id=>(c.data.chats[id]||[]).length).length;return `<div class="picker-entry"><button class="picker-card" data-character="${safe(c.id)}">${avatar(p)}<span style="flex:1;min-width:0"><span class="char-label">${safe(labelCharacter(c))}</span><span class="char-meta">친구 ${c.data?.friends?.length||0}명 · 대화방 ${n}개</span></span><span class="right-arrow">›</span></button>${isAdmin&&c.id!=='main'?`<button class="picker-remove" data-remove-character="${safe(c.id)}" aria-label="${safe(labelCharacter(c))} 삭제">삭제</button>`:''}</div>`}).join('');el('characterAdd').style.display=isAdmin?'block':'none';el('pickerAdmin').textContent=isAdmin?'☁️ 관리자 관리 / 로그아웃':'🔒 관리자 로그인';el('pickerStatus').textContent=pickerReady?cloudStatus:'☁️ 클라우드 기록을 불러오는 중…'}
function openPicker(){if(chatId)setTab('friends');closeProfile();closeModal();pickerVisible=true;el('characterPicker').classList.add('show');renderPicker()}
function chooseCharacter(id){const chosen=characters.find(c=>c.id===id);if(!chosen)return;captureCharacter();activeCharacterId=id;state=structuredClone(chosen.data);pickerVisible=false;el('characterPicker').classList.remove('show');document.documentElement.style.setProperty('--chat',state.wallpaper||'#b7c6d0');setClocks();setTab('friends')}
function newCharacter(){if(!isAdmin)return;if(characters.length>=8){toast('주인공은 최대 8명까지 만들 수 있어요.');return}modal(`<h2>새 주인공 만들기 💛</h2><form id="newCharacterForm"><label class="field">주인공 이름</label><input id="newCharacterName" class="fieldinput" maxlength="26" required placeholder="예: 세아"><label class="field">프로필 이모지</label><input id="newCharacterEmoji" class="fieldinput" maxlength="5" value="🐰"><p class="photohelp">빈 친구 목록과 대화방으로 시작해요. 만들고 나서 사진과 상태 메시지도 꾸밀 수 있어요.</p><div class="form-actions"><button type="button" class="secondary" id="newCharacterCancel">취소</button><button type="submit" class="primary">주인공 만들기</button></div></form>`);el('newCharacterCancel').onclick=closeModal;el('newCharacterForm').onsubmit=e=>{e.preventDefault();const name=el('newCharacterName').value.trim();if(!name)return;const emoji=el('newCharacterEmoji').value.trim()||'🐰';const data=structuredClone(defaults);data.me={...data.me,name,emoji,status:'',photo:'',music:''};data.friends=[];data.chats={};data.wallpaper='#b7c6d0';data.clockTime='';characters.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),data});save();closeModal();renderPicker();toast(`${name}의 카톡을 만들었어 ♡`)}}
function removeCharacter(id){if(!isAdmin||id==='main')return;const c=characters.find(x=>x.id===id);if(!c)return;if(!confirm(`${labelCharacter(c)}의 친구와 모든 대화를 삭제할까요?
삭제하면 클라우드에서도 사라져요.`))return;characters=characters.filter(x=>x.id!==id);if(activeCharacterId===id){activeCharacterId='main';state=structuredClone(characters[0].data)}save();renderPicker();toast('주인공 삭제 · 클라우드 저장 중')}

const el=id=>document.getElementById(id);const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.me&&Array.isArray(d.friends)&&d.chats)return d;}catch(e){}return structuredClone(defaults)}
function save(){if(!isAdmin)return;try{localStorage.setItem('mytalk_cast_cloud_backup_v2',JSON.stringify(exportCharacters()))}catch(e){toast('기기 백업 용량이 부족해요.')}window.dispatchEvent(new CustomEvent('mytalk:changed',{detail:exportCharacters()}))}
function toast(t){el('toast').textContent=t;el('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el('toast').classList.remove('show'),2500)}
function person(id){return id==='me'?state.me:state.friends.find(f=>f.id===id)}
function avatar(p,cls=''){if(!p)return '';return `<span class="avatar ${cls}" style="background:${safe(p.color||'#ccd3db')}">${p.photo?`<img src="${safe(p.photo)}" alt="">`:safe(p.emoji||'♡')}</span>`}
function icon(n){return `<svg class="ico"><use href="#i-${n}"/></svg>`}
function time(){const d=new Date();return `${d.getHours()<12?'오전':'오후'} ${d.getHours()%12||12}:${('0'+d.getMinutes()).slice(-2)}`}
function setClocks(){const d=new Date();const now=`${d.getHours()}:${('0'+d.getMinutes()).slice(-2)}`;document.querySelectorAll('.clock').forEach(e=>e.textContent=state.clockTime||now)}
function setTab(t){tab=t;chatId=null;el('chatView').style.display='none';el('listView').style.display='flex';el('pageTitle').textContent=t==='friends'?'친구':t==='chats'?'채팅':'더보기';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));el('addBtn').style.display=isAdmin&&t==='friends'?'grid':'none';el('musicBtn').style.display=isAdmin&&t==='friends'?'grid':'none';el('content').scrollTop=0;updateEditorUI();render()}
function updateEditorUI(){el('addBtn').style.display=isAdmin&&tab==='friends'?'grid':'none';el('musicBtn').style.display=isAdmin&&tab==='friends'?'grid':'none';el('settingsBtn').style.display=isAdmin?'grid':'none';el('profileOptions').style.display=isAdmin?'grid':'none';document.querySelector('.composer').style.display=isAdmin?'flex':'none';}function render(){const q=el('searchInput').value.trim().toLowerCase();if(tab==='friends')renderFriends(q);else if(tab==='chats')renderChats(q);else renderMore()}
function renderFriends(q){let html='';if(!q){html+=`<button class="person me" data-profile="me">${avatar(state.me,'me')}<span class="person-details"><div class="name">${safe(state.me.name)}</div><div class="status">${safe(state.me.status)}</div></span>${state.me.music?`<span class="music-pill">♫ ${safe(state.me.music)}</span>`:''}</button>`;html+='<div class="divider"></div><div class="sectionhead">업데이트한 친구 <span>›</span></div><div class="updated">';state.friends.slice(0,5).forEach(p=>html+=`<button class="updated-item" data-profile="${safe(p.id)}">${avatar(p)}<span>${safe(p.name)}</span></button>`);html+='</div><div class="divider"></div><div class="birth"><span class="birthday">🎂</span><span style="flex:1">친구의 생일을 확인해 보세요!</span><span>›</span></div>'}
const friends=state.friends.filter(p=>p.name.toLowerCase().includes(q)||p.status.toLowerCase().includes(q));const favorites=friends.filter(p=>p.favorite);if(favorites.length&&!q){html+='<div class="divider"></div><div class="sectionhead">즐겨찾기 <span>⌃</span></div>';favorites.forEach(p=>html+=rowFriend(p))}
html+=`<div class="divider"></div><div class="sectionhead">친구 ${friends.length}<span>⌃</span></div>`;friends.forEach(p=>html+=rowFriend(p));if(!friends.length)html+=isAdmin?'<div class="empty">아직 친구가 없어!<br>오른쪽 위 사람+ 버튼으로 추가해 봐 ♡</div>':'<div class="empty">아직 등록된 친구가 없어요 ♡</div>';html+='<p class="hint">공개용 가상 메신저 · 실제 카카오톡과는 연결되지 않아요.</p>';el('content').innerHTML=html}
function rowFriend(p){return `<button class="person" data-profile="${safe(p.id)}">${avatar(p)}<span class="person-details"><div class="name">${safe(p.name)}</div>${p.status?`<div class="status">${safe(p.status)}</div>`:''}</span>${p.music?`<span class="music-pill">♫ ${safe(p.music)}</span>`:''}</button>`}
function renderChats(q){let pairs=Object.keys(state.chats).filter(id=>person(id)&&state.chats[id]?.length).map(id=>({id,p:person(id),msgs:state.chats[id]}));pairs.sort((a,b)=> (b.msgs.at(-1).sort||0)-(a.msgs.at(-1).sort||0));pairs=pairs.filter(c=>c.p.name.toLowerCase().includes(q)||c.msgs.some(m=>m.text.toLowerCase().includes(q)));el('content').innerHTML=pairs.length?pairs.map(c=>`<button class="chatlist-row" data-chat="${safe(c.id)}">${avatar(c.p)}<span class="person-details"><div class="name">${safe(c.p.name)}</div><div class="message-preview">${safe(c.msgs.at(-1).text)}</div></span><span class="chatlist-meta">${safe(c.msgs.at(-1).at||'')}</span></button>`).join(''):'<div class="empty">아직 대화가 없어!<br>친구 프로필에서 채팅을 시작해 봐 ♡</div>'}
function renderMore(){el('content').innerHTML=`<div class="person me" style="padding-top:22px">${avatar(state.me,'me')}<span class="person-details"><div class="name">${safe(state.me.name)}</div><div class="status">${safe(state.me.status)}</div></span></div><div class="divider"></div>${isAdmin?`<button class="person" data-profile="me">${icon('pencil')} <span class="person-details">내 프로필 편집</span><span>›</span></button><button class="person" data-action="add">${icon('userplus')} <span class="person-details">친구 추가</span><span>›</span></button><button class="person" data-action="settings">${icon('settings')} <span class="person-details">화면 설정</span><span>›</span></button>`:''}<button class="person" data-action="characters">${icon('user')} <span class="person-details"><span class="name">🔁 주인공 바꾸기</span><span class="status">현재 ${safe(state.me.name)} · 주인공 ${characters.length}명</span></span><span>›</span></button><button class="person" data-action="cloud">${icon('settings')} <span class="person-details"><span class="name">${isAdmin?'☁️ 관리자 · 클라우드 설정':'🔒 관리자 로그인'}</span><span class="status">${safe(cloudStatus)}</span></span><span>›</span></button><div style="margin:18px 18px 6px;padding:13px 14px;background:#fff9d6;border:1px solid #f5e9a4;border-radius:12px;font-size:13px;line-height:1.8"><b>✨ 주인공 선택 업데이트 적용됨</b><div>주인공 선택 · 메시지 수정 · 삭제 · 날짜와 시간 변경</div><div style="font-size:12px;color:#6b6657">관리자 로그인 후 채팅방 말풍선을 터치해 봐 ♡</div></div><div class="empty">${isAdmin?'관리자 전용 · 수정하면 클라우드에 저장돼요.':'방문자 모드 · 누구나 구경하고 관리자만 수정할 수 있어요.'}</div>`}
function openProfile(id){const p=person(id);if(!p)return;profileId=id;el('profileOverlay').classList.add('show');el('profileBody').innerHTML=`${avatar(p)}<h2>${safe(p.name)}</h2><p>${safe(p.status||'')}</p><div class="profile-actions">${id!=='me'?`<button class="profile-action" id="goChat">${icon('chat')}<span>1:1 채팅</span></button>`:''}${isAdmin?`<button class="profile-action" id="goEdit">${icon('pencil')}<span>프로필 편집</span></button>`:''}</div>`;if(isAdmin)el('goEdit').onclick=()=>showEdit(id);if(id!=='me')el('goChat').onclick=()=>{closeProfile();openChat(id)}}
function closeProfile(){el('profileOverlay').classList.remove('show');profileId=null}
function openChat(id){const p=person(id);if(!p)return;chatId=id;by='me';state.chats[id]??=[];el('chatTitle').textContent=p.name;el('senderToggle').textContent='나로 보내기';el('listView').style.display='none';el('chatView').style.display='flex';el('msgInput').value='';document.documentElement.style.setProperty('--chat',state.wallpaper||'#b7c6d0');renderLog()}
function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function messageDate(m){if(/^\d{4}-\d{2}-\d{2}$/.test(m.date||''))return m.date;if(m.at==='어제'){const d=new Date();d.setDate(d.getDate()-1);return localDate(d)}return localDate()}
function displayDate(s){const d=new Date(s+'T12:00:00');return Number.isNaN(d.valueOf())?s:new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(d)}
function timeFromMessage(m){if(/^\d\d:\d\d$/.test(m.time24||''))return m.time24;const match=String(m.at||'').match(/(오전|오후)\s*(\d{1,2}):(\d{2})/);if(match){const hour=(Number(match[2])%12)+(match[1]==='오후'?12:0);return `${String(hour).padStart(2,'0')}:${match[3]}`}const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function ampm(t){const [h,m]=t.split(':').map(Number);return `${h<12?'오전':'오후'} ${h%12||12}:${String(m).padStart(2,'0')}`}
function renderLog(){const p=person(chatId);if(!p)return;const msgs=state.chats[chatId]||[];let html=isAdmin?'<div class="chat-edit-hint">말풍선을 누르면 수정 · 시간 변경 · 삭제 ♡</div>':'';let previous='';msgs.forEach((m,i)=>{const md=messageDate(m);if(previous!==md){html+=`<div class="date-line">${safe(displayDate(md))}</div>`;previous=md}const bubble=isAdmin?`<button type="button" class="bubble bubble-editable" data-msg-index="${i}" aria-label="메시지 수정 또는 삭제">${safe(m.text)}</button>`:`<div class="bubble">${safe(m.text)}</div>`;html+=`<div class="msg-row ${m.by==='me'?'mine':''}">${m.by==='other'?avatar(p):''}<div class="msg-content">${m.by==='other'?`<div class="msg-name">${safe(p.name)}</div>`:''}<div class="bubble-line">${bubble}<span class="msg-time">${safe(m.at||'')}</span></div></div></div>`});if(!msgs.length)html+='<div class="empty" style="color:#526272">아직 대화가 없어 ♡</div>';el('chatLog').innerHTML=html;el('chatLog').scrollTop=el('chatLog').scrollHeight}
function send(){if(!isAdmin)return;const v=el('msgInput').value.trim();if(!v||!chatId)return;const now=new Date();state.chats[chatId]??=[];state.chats[chatId].push({by,text:v,at:time(),time24:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,date:localDate(now),sort:now.getTime()});save();el('msgInput').value='';renderLog()}
function messageMenu(index){if(!isAdmin||!chatId)return;const m=state.chats[chatId]?.[index];if(!m)return;modal(`<h2>메시지 관리 ♡</h2><div class="msg-manage-preview">${safe(m.text)}</div><div class="msg-manage-buttons"><button type="button" id="mEditText">✏️ 내용 수정</button><button type="button" id="mEditDate">🕒 날짜·시간 변경</button><button type="button" id="mDelete" class="warn">🗑️ 메시지 삭제</button><button type="button" id="mCancel">취소</button></div><p class="photohelp">수정·삭제 결과는 클라우드에 저장되어 방문자에게도 똑같이 보여요.</p>`);el('mEditText').onclick=()=>editMessage(index,'text');el('mEditDate').onclick=()=>editMessage(index,'time');el('mDelete').onclick=()=>deleteMessage(index);el('mCancel').onclick=closeModal}
function editMessage(index,kind){if(!isAdmin||!chatId)return;const m=state.chats[chatId]?.[index];if(!m)return;const originalRoom=chatId;const date=messageDate(m),clock=timeFromMessage(m);modal(kind==='text'?`<h2>메시지 수정</h2><form id="msgEditForm"><label class="field" for="messageText">대화 내용</label><textarea id="messageText" class="fieldinput" rows="5" maxlength="3000" required>${safe(m.text)}</textarea><div class="form-actions"><button type="button" class="secondary" id="msgCancel">취소</button><button type="submit" class="primary">수정 저장</button></div></form>`:`<h2>날짜·시간 변경</h2><form id="msgEditForm"><label class="field" for="messageDate">대화 날짜</label><input type="date" class="fieldinput" id="messageDate" value="${safe(date)}" required><label class="field" for="messageTime">대화 시간</label><input type="time" class="fieldinput" id="messageTime" value="${safe(clock)}" required><p class="photohelp">실제 시간이 아닌 원하는 날짜·시간으로 표시돼요. 메시지 순서는 그대로 유지돼요.</p><div class="form-actions"><button type="button" class="secondary" id="msgCancel">취소</button><button type="submit" class="primary">시간 저장</button></div></form>`);el('msgCancel').onclick=closeModal;el('msgEditForm').onsubmit=e=>{e.preventDefault();if(!isAdmin)return;const current=state.chats[originalRoom]?.[index];if(!current){closeModal();toast('메시지를 찾지 못했어.');return}if(kind==='text'){const val=el('messageText').value.trim();if(!val){toast('메시지 내용을 입력해 줘.');return}current.text=val}else{const date=el('messageDate').value,t=el('messageTime').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:\d{2}$/.test(t)){toast('날짜와 시간을 확인해 줘.');return}current.date=date;current.time24=t;current.at=ampm(t);current.sort=new Date(`${date}T${t}:00`).getTime()}save();closeModal();renderLog();toast('수정했어 · 클라우드 저장 중 ♡')}}
function deleteMessage(index){if(!isAdmin||!chatId)return;const arr=state.chats[chatId];if(!arr?.[index])return;if(!confirm('이 메시지를 삭제할까?\n삭제하면 다른 기기와 방문자 화면에서도 사라져.'))return;arr.splice(index,1);save();closeModal();renderLog();toast('메시지 삭제 · 클라우드 저장 중 ♡')}
function modal(html){el('modal').innerHTML=html;el('modalBg').classList.add('show')}function closeModal(){el('modalBg').classList.remove('show');el('modal').innerHTML=''}
function showEdit(id){if(!isAdmin)return;const creating=id==='new';const p=creating?{id:'new',name:'',status:'',emoji:'🐰',color:'#f0c2d0',photo:'',music:''}:person(id);if(!p)return;modal(`<h2>${creating?'친구 추가':'프로필 편집'}</h2><form id="editForm"><label class="field">이름</label><input class="fieldinput" id="edName" required maxlength="26" value="${safe(p.name)}" placeholder="친구 이름"><label class="field">상태 메시지</label><input class="fieldinput" id="edStatus" maxlength="90" value="${safe(p.status||'')}" placeholder="상태 메시지"><label class="field">프로필 이모지</label><input class="fieldinput" id="edEmoji" maxlength="5" value="${safe(p.emoji||'♡')}" placeholder="🐰"><label class="field">프로필 사진 업로드 (선택)</label><input type="file" id="edFile" accept="image/*" class="fieldinput"><p class="photohelp">사진을 선택하면 이모지 대신 표시돼요. 사진은 공개 클라우드에 저장되며 방문자에게도 보여요.</p><label class="field">프로필 뮤직 / 한마디</label><input class="fieldinput" id="edMusic" maxlength="36" value="${safe(p.music||'')}" placeholder="♫ 노래 제목"><label class="field">프로필 배경색</label><input class="fieldinput" id="edColor" type="color" style="padding:5px;height:43px" value="${safe(p.color||'#d4c0d8')}">${!creating&&id!=='me'?`<label style="display:flex;align-items:center;gap:8px;margin-top:13px;font-size:13px"><input id="edFav" type="checkbox" ${p.favorite?'checked':''}> 즐겨찾기</label>`:''}<div class="form-actions">${!creating&&id!=='me'?'<button type="button" class="danger" id="edDelete">친구 삭제</button>':''}<button type="button" class="secondary" id="edCancel">취소</button><button type="submit" class="primary">저장</button></div></form>`);el('edCancel').onclick=closeModal;if(!creating&&id!=='me')el('edDelete').onclick=()=>{if(!confirm(`${p.name}님을 친구 목록에서 삭제할까요?`))return;state.friends=state.friends.filter(f=>f.id!==id);delete state.chats[id];save();closeModal();closeProfile();setTab('friends');toast('친구 삭제 · 클라우드 저장 중')};el('editForm').onsubmit=async e=>{e.preventDefault();const name=el('edName').value.trim();if(!name)return;const file=el('edFile').files[0];let photo=p.photo||'';if(file){try{photo=await compressImage(file)}catch(e){toast('이미지를 읽지 못했어요');return}}const next={...p,name,status:el('edStatus').value.trim(),emoji:el('edEmoji').value.trim()||'♡',music:el('edMusic').value.trim(),color:el('edColor').value,photo};if(id==='me'){state.me=next}else if(creating){next.id='f'+Date.now();next.favorite=false;state.friends.push(next)}else{next.favorite=el('edFav').checked;state.friends=state.friends.map(f=>f.id===id?next:f)}save();closeModal();closeProfile();setTab('friends');toast(creating?'친구를 추가했어 · 클라우드 저장 중':'수정했어 · 클라우드 저장 중')}}
function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,350/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'))};img.src=url})}
function addFriend(){if(isAdmin)showEdit('new')}
function showSettings(){if(!isAdmin)return;const colors=['#b7c6d0','#b0c3e0','#ddd1d9','#b2ccbc','#b6b6b6'];modal(`<h2>나만의 톡 설정</h2><p style="font-size:13px;color:#777;line-height:1.6">채팅방 배경색을 바꿔 봐! 변경 내용은 공개 사이트에 저장돼.</p><div style="display:flex;gap:10px;margin:17px 0">${colors.map(c=>`<button class="wallpick" data-color="${c}" style="width:36px;height:36px;border-radius:50%;background:${c};border:2px solid ${state.wallpaper===c?'#111':'#fff'}"></button>`).join('')}</div><label class="field" for="setTopClock">상단 시계 시간 꾸미기 (선택)</label><input class="fieldinput" type="time" id="setTopClock" value="${safe(state.clockTime||'')}"><div style="display:flex;gap:8px;margin-top:8px"><button class="secondary" id="clockReal">실제 시간</button><button class="primary" id="clockSave">시계 적용</button></div><p class="photohelp">원하는 시간으로 고정하거나 실제 시간으로 돌아갈 수 있어.</p><p style="font-size:12px;color:#999;line-height:1.6">주의: 저장한 프로필과 채팅은 모두 방문자에게 공개돼. 개인 정보나 실제 비밀 대화는 넣지 마.</p><div class="form-actions"><button class="danger" id="resetAll">처음 상태로 초기화</button><button class="primary" id="settingsDone">닫기</button></div>`);el('modal').querySelectorAll('.wallpick').forEach(b=>b.onclick=()=>{state.wallpaper=b.dataset.color;save();document.documentElement.style.setProperty('--chat',state.wallpaper);showSettings()});el('settingsDone').onclick=closeModal;el('clockSave').onclick=()=>{state.clockTime=el('setTopClock').value;setClocks();save();toast('시계가 바뀌었어 ♡')};el('clockReal').onclick=()=>{state.clockTime='';setClocks();save();showSettings();toast('실제 시간으로 돌아왔어 ♡')};el('resetAll').onclick=()=>{if(!confirm('친구와 대화 기록을 모두 초기화할까요?'))return;state=structuredClone(defaults);save();closeModal();closeProfile();setTab('friends');toast('초기화 · 클라우드 저장 중')}}
el('pickerList').addEventListener('click',e=>{const rem=e.target.closest('[data-remove-character]');if(rem){removeCharacter(rem.dataset.removeCharacter);return}const choice=e.target.closest('[data-character]');if(choice){if(!pickerReady){toast('클라우드 연결 상태를 확인 중이에요.');return}chooseCharacter(choice.dataset.character)}});
el('characterAdd').onclick=newCharacter;
el('pickerAdmin').onclick=()=>window.TalkCloud?.open();
el('switchCharacter').onclick=openPicker;
el('chatSwitch').onclick=openPicker;
el('content').addEventListener('click',e=>{const a=e.target.closest('[data-profile],[data-chat],[data-action]');if(!a)return;if(a.dataset.profile)openProfile(a.dataset.profile);else if(a.dataset.chat)openChat(a.dataset.chat);else if(a.dataset.action==='add')addFriend();else if(a.dataset.action==='settings')showSettings();else if(a.dataset.action==='cloud')window.TalkCloud?.open();else if(a.dataset.action==='characters')openPicker()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));el('searchBtn').onclick=()=>{searchVisible=!searchVisible;el('searchArea').classList.toggle('open',searchVisible);if(searchVisible)el('searchInput').focus();else{el('searchInput').value='';render()}};el('searchInput').oninput=render;el('addBtn').onclick=addFriend;el('settingsBtn').onclick=showSettings;el('musicBtn').onclick=()=>toast('프로필에서 원하는 음악 제목을 적어 봐 ♫');el('profileClose').onclick=closeProfile;el('profileOptions').onclick=()=>{if(isAdmin)showEdit(profileId)};el('modalBg').onclick=e=>{if(e.target===el('modalBg'))closeModal()};el('chatBack').onclick=()=>setTab('chats');el('chatTitle').onclick=()=>{const id=chatId;setTab('friends');openProfile(id)};el('chatMenu').onclick=()=>toast('아래의 전송자 버튼을 눌러 상대 말풍선도 만들 수 있어!');el('senderToggle').onclick=()=>{if(!isAdmin)return;by=by==='me'?'other':'me';el('senderToggle').textContent=by==='me'?'나로 보내기':'상대로 보내기'};el('chatLog').addEventListener('click',e=>{const b=e.target.closest('[data-msg-index]');if(b&&isAdmin)messageMenu(Number(b.dataset.msgIndex))});el('chatLog').addEventListener('contextmenu',e=>{const b=e.target.closest('[data-msg-index]');if(b&&isAdmin){e.preventDefault();messageMenu(Number(b.dataset.msgIndex))}});el('sendBtn').onclick=send;el('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(el('modalBg').classList.contains('show'))closeModal();else if(el('profileOverlay').classList.contains('show'))closeProfile();else if(chatId)setTab('chats')}});window.TalkApp={getState:()=>exportCharacters(),getOldState:()=>load(),applyCloud:importCharacters,setAdmin:v=>{isAdmin=!!v;updateEditorUI();render();renderPicker()},setReady:v=>{pickerReady=!!v;renderPicker()},setStatus:v=>{cloudStatus=v;if(tab==='more')render();renderPicker()},openPicker,chooseCharacter,modal,closeModal,toast};setClocks();setInterval(setClocks,30000);setTab('friends');renderPicker();
})();
</script>
<script id="firebaseConfigData" type="application/json">{"apiKey": "AIzaSyDa_rRRU14YDG-6a4buXR3pPFMNeJ0qa70", "authDomain": "mytalk-cloud-c006c.firebaseapp.com", "projectId": "mytalk-cloud-c006c", "storageBucket": "mytalk-cloud-c006c.firebasestorage.app", "messagingSenderId": "365839445595", "appId": "1:365839445595:web:a743c3f7d139e01c0bd97e"}</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import {getFirestore,doc,onSnapshot,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
const ui=window.TalkApp;
const fix=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let auth,ref,admin=false,hasCloud=false,cloudReady=false,timer=null,writer='t'+Date.now().toString(36)+Math.random().toString(36).slice(2),lastId='',pending=false;
const nice=e=>({'auth/invalid-credential':'이메일 또는 비밀번호를 확인해 줘.','auth/invalid-email':'이메일 주소를 확인해 줘.','auth/unauthorized-domain':'Firebase Authentication 승인 도메인에 idide.github.io를 추가해 줘.','permission-denied':'보안 규칙과 로그인 계정 UID를 확인해 줘.','resource-exhausted':'데이터 용량 또는 요금제 한도를 확인해 줘.'})[e?.code]||e?.message||'요청을 처리하지 못했어요.';
function buttons(){ui.modal(`<h2>☁️ 공개 카톡 관리</h2><p style="font-size:13px;line-height:1.8;color:#666">${fix(admin?'로그인했어 · 저장은 등록된 관리자 계정만 가능해요.':'방문자는 누구나 볼 수 있지만 수정은 관리자만 할 수 있어요.')}</p>${admin?`<div class="form-actions" style="flex-wrap:wrap"><button id="publishDevice" class="primary">이 기기 기록 공개하기</button><button id="cloudLogout" class="secondary">로그아웃</button></div><p class="photohelp">처음 게시할 때만 기록 공개하기를 눌러 줘. 이미 클라우드에 내용이 있다면 덮어쓰니 주의해.</p>`:`<form id="adminLogin"><label class="field">관리자 이메일</label><input type="email" class="fieldinput" id="aEmail" autocomplete="email" required placeholder="email@example.com"><label class="field">비밀번호</label><input type="password" class="fieldinput" id="aPassword" autocomplete="current-password" required><div class="form-actions"><button class="primary" type="submit">로그인</button></div></form>`}`);
if(admin){document.getElementById('publishDevice').onclick=publishDevice;document.getElementById('cloudLogout').onclick=async()=>{await signOut(auth);ui.closeModal()}}
else{document.getElementById('adminLogin').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,document.getElementById('aEmail').value.trim(),document.getElementById('aPassword').value);ui.closeModal();ui.toast('로그인했어 ♡')}catch(err){ui.toast(nice(err))}}}}
async function publishDevice(){
const old=ui.getOldState();
if(!confirm(`${hasCloud?'지금 공개된 내용을 완전히 덮어써요.':'이 기기의 기존 기록을 처음 게시해요.'}\n\n원래 카톡을 꾸몄던 같은 브라우저에서만 진행해 줘. 진행할까?`))return;
const use=old;
try{await write(use);ui.closeModal();ui.toast('이 기기의 친구와 대화가 공개됐어 ♡')}catch(e){ui.toast(nice(e))}
}
async function write(value){
const data=JSON.stringify(value);
if(new Blob([data]).size>850000)throw new Error('사진·대화가 너무 많아 한 번에 저장하기 어려워요. 사진을 줄여 줘.');
const id=writer+'-'+Date.now();pending=true;lastId=id;ui.setStatus('☁️ 저장하는 중...');
try{await setDoc(ref,{state:value,revision:id,updatedAt:serverTimestamp()});hasCloud=true;ui.setStatus('☁️ 저장 완료');}
finally{pending=false}}
window.TalkCloud={open:buttons};
window.addEventListener('mytalk:changed',()=>{if(!admin)return;clearTimeout(timer);timer=setTimeout(()=>{timer=null;write(ui.getState()).catch(e=>{ui.setStatus('☁️ 저장 실패');ui.toast(nice(e))})},800)});
try{
const txt=document.getElementById('firebaseConfigData').textContent.trim();const cfg=JSON.parse(txt);
if(!cfg?.apiKey||!cfg?.projectId||!cfg?.appId)throw new Error('Firebase 웹 앱 설정을 넣어야 해요.');
const app=initializeApp(cfg);auth=getAuth(app);const db=getFirestore(app);ref=doc(db,'publicSite','main');
onAuthStateChanged(auth,user=>{admin=!!user;ui.setAdmin(admin&&cloudReady);ui.setStatus(admin?'☁️ 관리자로 로그인됨':'방문자 모드 · 공개 기록 보기');});
onSnapshot(ref,snapshot=>{cloudReady=true;ui.setAdmin(admin);hasCloud=snapshot.exists();if(!hasCloud){ui.setReady(true);ui.setStatus('공개된 기록 없음 · 관리자 첫 게시 필요');return}const data=snapshot.data();if(!pending&&!timer&&data?.state&&data.revision!==lastId){ui.applyCloud(data.state);ui.setStatus(admin?'☁️ 관리자 · 동기화됨':'☁️ 공개 친구창 · 최신 기록');}ui.setReady(true);},e=>{ui.setAdmin(false);ui.setReady(true);ui.setStatus('클라우드를 불러오지 못했어요 · '+nice(e));ui.toast('클라우드 연결을 확인해 줘.');});
}catch(e){ui.setReady(true);ui.setStatus('클라우드 설정 미완료');window.TalkCloud.open=()=>ui.toast('Firebase 설정값을 넣은 파일이 필요해요.');}
</script>
